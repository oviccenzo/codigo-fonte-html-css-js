<meta charset="UTF-8">

<script>
    function pulaLinha(){       
        document.write("<br>"); 
    }

    function mostra(frase){
        document.write(frase);
        pulaLinha();
    }

    var convidados = prompt("Numero de convidados");
    var vips = prompt("Numero de convidados VIP's");

    var total = convidados + vips;

    mostra("O total de convidados é " + total);

</script>
