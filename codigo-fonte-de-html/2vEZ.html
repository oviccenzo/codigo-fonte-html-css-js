<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Peso Ideal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container{
            width: 80%;
            margin: 50px auto;
            background-color:#ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        form {
            max-width: 400px;
            margin-bottom: 10px;
        }
        input[type="text"], select{
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #931717;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input[type="submit"]{
            width: 100%;
            padding: 10px;
            background-color: #4caf50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="submit"]:hover{
            background-color: #45a049;
        }
        .result{
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Calculadora de Peso Ideal</h1>
        <form id="calculator-form">
            <label for="height">Altira (metros):</label>
            <input type="text" id="height" name="height" placeholder="Informe a altura">

            <label for="gender">Sexo:</label>
            <select id="gender" name="gender" name="gender">
                <option value="male">Masculino</option>
                <option ></option>
            </select>
        </form>
    </div>
</body>
</html>
