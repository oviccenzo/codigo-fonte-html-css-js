<meta charset="UTF-8">
<script>

    function pulaLinha(){
        document.write("<br>");
    }

    function mostra(frase){
        document.write(frase);
        pulaLinha();
    }

    function somaDoisNumeros(numero1, numero2){
        mostra("A somma dos dois numeros é : " + (numero1 + numero2));
    }
    

    somaDoisNumeros(10,40);
</script>
