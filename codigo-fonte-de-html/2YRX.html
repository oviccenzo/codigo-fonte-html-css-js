<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análise de Entrevistados</title>
</head>
<body>

  <h1>Análise de Entrevistados</h1>

  <form id="entrevista-form">
    <label for="quantidade">Quantidade de Pessoas Entrevistadas:</label>
    <input type="number" id="quantidade" name="quantidade" min="1" required><br><br>

    <div id="pessoas"></div>

    <button type="button" onclick="calcular()">Calcular</button>
  </form>

  <div id="resultado"></div>

  <script>
    function gerarFormulario() {
      var quantidade = parseInt(document.getElementById('quantidade').value);
      var formulario = '';

      for (var i = 1; i <= quantidade; i++) {
        formulario += '<h2>Pessoa ' + i + '</h2>';
        formulario += '<label for="idade' + i + '">Idade:</label>';
        formulario += '<input type="number" id="idade' + i + '" name="idade' + i + '" required><br>';
        formulario += '<label for="sexo' + i + '">Sexo (M/F):</label>';
        formulario += '<input type="text" id="sexo' + i + '" name="sexo' + i + '" required maxlength="1" pattern="[MmFf]"><br>';
      }

      document.getElementById('pessoas').innerHTML = formulario;
    }

    function calcular() {
      var quantidade = parseInt(document.getElementById('quantidade').value);
      var totalIdade = 0;
      var totalMulheres = 0;
      var totalHomens = 0;
      var faixaEtaria = [0, 0, 0, 0, 0];
      var porcentagemMulheresFaixa2 = 0;

      // Loop para calcular as médias de idade e a quantidade de pessoas em cada faixa etária
      for (var i = 1; i <= quantidade; i++) {
        var idade = parseInt(document.getElementById('idade' + i).value);
        var sexo = document.getElementById('sexo' + i).value.toUpperCase();

        totalIdade += idade;

        if (sexo === 'F') {
          totalMulheres++;
        } else {
          totalHomens++;
        }

        if (idade <= 15) {
          faixaEtaria[0]++;
        } else if (idade >= 16 && idade <= 30) {
          faixaEtaria[1]++;
        } else if (idade >= 31 && idade <= 45) {
          faixaEtaria[2]++;
        } else if (idade >= 46 && idade <= 60) {
          faixaEtaria[3]++;
        } else {
          faixaEtaria[4]++;
        }
      }

      // Cálculo da média de idade das pessoas, das mulheres e dos homens
      var mediaIdade = totalIdade / quantidade;
      var mediaIdadeMulheres = totalMulheres > 0 ? totalIdade / totalMulheres : 0;
      var mediaIdadeHomens = totalHomens > 0 ? totalIdade / totalHomens : 0;

      // Cálculo da porcentagem de mulheres na segunda faixa etária
      porcentagemMulheresFaixa2 = (faixaEtaria[1] > 0 ? (totalMulheres / faixaEtaria[1]) * 100 : 0);

      // Exibindo os resultados na página
      var resultado = '<h2>Resultados</h2>';
      resultado += '<p>Média de idade das pessoas: ' + mediaIdade.toFixed(2) + ' anos</p>';
      resultado += '<p>Média de idade das mulheres: ' + mediaIdadeMulheres.toFixed(2) + ' anos</p>';
      resultado += '<p>Média de idade dos homens: ' + mediaIdadeHomens.toFixed(2) + ' anos</p>';
      resultado += '<p>Quantidade de pessoas em cada faixa etária:';
      resultado += '<ul>';
      resultado += '<li>Até 15 anos: ' + faixaEtaria[0] + '</li>';
      resultado += '<li>De 16 a 30 anos: ' + faixaEtaria[1] + '</li>';
      resultado += '<li>De 31 a 45 anos: ' + faixaEtaria[2] + '</li>';
      resultado += '<li>De 46 a 60 anos: ' + faixaEtaria[3] + '</li>';
      resultado += '<li>Acima de 60 anos: ' + faixaEtaria[4] + '</li>';
      resultado += '</ul>';
      resultado += '<p>Porcentagem de mulheres na segunda faixa etária (16 a 30 anos): ' + porcentagemMulheresFaixa2.toFixed(2) + '%</p>';

      document.getElementById('resultado').innerHTML = resultado;
    }

    // Chama a função para gerar o formulário quando a página carrega
    window.onload = gerarFormulario;
  </script>

</body>
</html>
