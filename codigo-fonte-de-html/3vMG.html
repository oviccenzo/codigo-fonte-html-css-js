<meta charset="UTF-8">
<script>
    
    function pulaLinha() {

        document.write("<br>");
        document.write("<br>");
    }

    function mostra(frase){

        document.write(frase);
        pulaLinha();
    }

    var numeroPensado = 10;

    var tentativas = 2;
    
    while(tentativas <= 3) {

        var chute = parseInt(prompt("Digite seu chute!"));

        if(chute == numeroPensado) {

            mostra("Você ACERTOU, o numero pensado era " + numeroPensado);
            break;

        } else {

            mostra("Você ACERTOU!");
        }
        tentativas++;
    }
    mostra("FIM");
</script>
