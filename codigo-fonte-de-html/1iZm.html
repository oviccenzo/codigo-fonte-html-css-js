<!DOCTYPE html>
<meta charset="UTF-8">

<script>

    function pulaLinha(){

        document.write("<br>");
        document.write("<br>");
    }

    function mostra(frase){

        document.write(frase);
        pulaLinha();
    }

    var multiplicador = 3;

    for(var multiplicador = 3; multiplicador <= 30; multiplicador++) {

        mostra(3 * multiplicador);
    }


    mostra("FIM");
     
</script>
