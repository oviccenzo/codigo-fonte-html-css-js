<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura e Sugestão de Vestuário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: 50px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        form {
            max-width: 400px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #4caf50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Conversor de Temperatura e Sugestão de Vestuário</h1>
    <form id="temperatureConverterForm">
        <label for="temperatureCelsius">Temperatura em Celsius (°C):</label>
        <input type="number" id="temperatureCelsius" name="temperatureCelsius" placeholder="Informe a temperatura em Celsius">

        <input type="submit" value="Converter">
    </form>

    <div class="result" id="result"></div>
</div>

<script>
    document.getElementById('temperatureConverterForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent form submission
        var temperatureCelsius = parseFloat(document.getElementById('temperatureCelsius').value);
        var resultElement = document.getElementById('result');
        var temperatureFahrenheit = (9 * temperatureCelsius + 160) / 5;
        var clothingSuggestion;

        if (temperatureFahrenheit < 65) {
            clothingSuggestion = 'Vista calças.';
        } else {
            clothingSuggestion = 'Vista bermudas.';
        }

        resultElement.textContent = 'Temperatura em Fahrenheit: ' + temperatureFahrenheit.toFixed(2) + ' °F. ' + clothingSuggestion;
    });
</script>

</body>
</html>
