<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scalet=1.0">
    <title>Calculadora de Diferença de Idade</title>
</head>

<h1>Calculadora DE Diferença de Idade</h1>

<form id="idade-form">
    <label for="idade1">Idade de Pessoa 1:</label>
    <input type="number" id="idade1" name="idade1" requierd><br>

    <label for="idade2">Idade da Pessoa 2:</label>
    <input type="number" id="idade2" name="idade2" required><br>

    <button type="submit">Calcular</button>
</form>

<div id="resultado"></div>

<script>
    document.getElementById('idade-form').addEventListener('submit', function(event){
    event.preventDefault(); //Evita o envio do formulario por padrão

    //Obter os valores das idades inseridas
    var idade1 = parseInt(document.getElementById('idade1').value);
    var idade2 = parseInt(document.getElementById('idade2').value);

    //Calcular a diferença de idade
    var diferenca = Math.abs(idade1 - idade2);

    //Exibir o resultado na pagina
    document.getElementById('resultado').innerHTML = 'A diferença de idade é de ' + diferenca + ' anos ';
    });
</script>
</html>
