<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula23</title>

    <style>
        main{
            display: flex;
            flex-wrap: wrap;
            height: 100px;
            text-align: center;
        }

        .item1{
            width: 20%;
            background-color: aquamarine;
        }

        .item2{
            width: 60%;
            background-color: chartreuse;
        }

        .item3{
            width: 20%;
            background-color: blueviolet;
        }
        
        header,footer{
            text-align: center;
            background-color: rgb(from rgb(0, 204, 255) r g b);
        } 

    </style>

</head>
<body>
    <header>header</header>
    <main>
        <div class="item1">numero 234</div>
        <div class="item2">numero 872</div>
        <div class="item3">numero 564</div>
    </main>
    <footer>Footer</footer>
</body>
</html>
